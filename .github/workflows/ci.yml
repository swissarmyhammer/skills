name: CI

# The org test contract (swissarmyhammer/workflows' README) applies here in
# full. This repository satisfies it with the unit job of the shared workflow:
#
# - The unit job runs `swift test` at the root. The single
#   `SkillsMarketplaceTests` target holds unit tests only: each one reads the
#   checked-in `skills/` folder, and none needs a network, a GPU, or much
#   wall-clock time.
# - No `test-skip` input: no suite is held out of the unit job.
# - No `integration-*` input: this repository has no integration job, because
#   it has no test that needs a network or an on-device model.
# - Every input of the shared workflow is optional, thus the job below gives
#   none.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
